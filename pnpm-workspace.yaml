# pnpm blocks dependencies' install scripts by default, so esbuild never unpacks its platform
# binary and vitest fails at startup. Since pnpm 11 the key is `allowBuilds` here, with an explicit
# boolean per package.
allowBuilds:
  esbuild: true
  lefthook: true
minimumReleaseAgeExclude:
  - '@leemour/cli-core@0.1.0 || 0.1.1 || 0.2.0 || 0.3.0 || 0.4.0 || 0.5.0 || 0.6.0 || 0.6.1 || 0.7.0 || 0.9.0 || 0.10.0 || 0.11.0 || 0.13.0 || 0.15.0 || 0.16.0 || 0.17.0 || 0.17.3'
  - '@leemour/cli-messaging@0.49.0'
  - '@leemour/cli-messaging-onnx@1.0.0'
  - '@leemour/cli-messaging-sqlite@1.0.0'
  - '@leemour/cli-tasks@0.1.0'
  - '@wirecat/*'
