name: Parity

# Each CLI checks only the manifest of the shared-package version it pins, so a row this repository
# gets wrong shows up there weeks later. This checks every CLI's main against this manifest now.
# Their main, not npm: a row lists a CLI in `in` once its main has it, and a release always trails that.
# Built against this checkout, not their pin: the pin prints the last release's shape, which a change to
# that shape can never match. The pinned pairing is each CLI's own `parity:check`.
# It runs inside full validation (push to main, release, monthly) and by hand, never on a pull request.
# `app_ref` builds a CLI's branch instead of its main, for a release whose CLIs adopt it on a branch
# (bin/release --app-ref, scripts/parity/app-ref.sh).
on:
  workflow_call:
    inputs:
      app_ref:
        type: string
        default: main
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch of tg-cli and max-cli to build"
        type: string
        default: main

permissions:
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { cli: max, repo: max-cli }
          - { cli: tg, repo: tg-cli }
          - { cli: wa, repo: whatsapp-cli }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: app
        run: shared/scripts/parity/app-ref.sh ${{ matrix.cli }} ${{ matrix.repo }} >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/${{ matrix.repo }}
          ref: ${{ steps.app.outputs.ref }}
          path: cli
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm pack --out ../cli-core.tgz
        working-directory: shared
      - name: Build ${{ matrix.cli }}-cli ${{ steps.app.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh ${{ matrix.cli }} cli cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.app.outputs.ref }}
      - name: Check ${{ matrix.cli }}-cli against this manifest
        run: |
          node cli/dist/bin/${{ matrix.cli }}.js commands --json > commands.json
          node shared/dist/parity/bin.js ${{ matrix.cli }} < commands.json

  wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: shared
          persist-credentials: false
      - id: max
        run: shared/scripts/parity/app-ref.sh max >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - id: tg
        run: shared/scripts/parity/app-ref.sh tg >> "$GITHUB_OUTPUT"
        env:
          PR_BRANCH: ${{ github.head_ref }}
          APP_REF: ${{ inputs.app_ref }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/max-cli
          ref: ${{ steps.max.outputs.ref }}
          path: max
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: WireCatLabs/tg-cli
          ref: ${{ steps.tg.outputs.ref }}
          path: tg
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: shared/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          # No store cache: this job builds other repositories' branches, so a cache it saved would
          # feed their dependencies to the next run.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm pack --out ../cli-core.tgz
        working-directory: shared
      - name: Build max-cli ${{ steps.max.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh max max cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.max.outputs.ref }}
      - name: Build tg-cli ${{ steps.tg.outputs.ref }} against this cli-core
        run: shared/scripts/parity/build-app.sh tg tg cli-core.tgz "$APP_REF"
        env:
          APP_REF: ${{ steps.tg.outputs.ref }}
      - run: |
          node max/dist/bin/max.js commands --json > max.json
          node tg/dist/bin/tg.js commands --json > tg.json
          node shared/dist/parity/bin.js wording max.json tg.json
