name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: leemour/cli-core/.github/workflows/node-ci.yml@v0.11.0
    with:
      checks: |
        pnpm docs:check
        pnpm check:dist
      # The smoke runs the sources; only the second line loads the Bun half of the Drizzle bundle in dist.
      bun-run: |
        pnpm smoke:bun
        pnpm build && bun scripts/check-dist.ts

  old-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # The last official Node whose SQLite has no FTS5 (measured 2026-10-01).
      - uses: actions/setup-node@v7
        with:
          node-version: 22.15.0
      - run: node scripts/check-old-node.mjs

  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # A warning, never a failure: bin/release takes the next free version itself (2026-09-29).
      - name: version above main and npm
        continue-on-error: true
        run: |
          pr=$(node -p 'require("./package.json").version')
          git fetch -q --depth=1 origin main
          main=$(git show FETCH_HEAD:package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          [ "$pr" != "$main" ] || exit 0
          name=$(node -p 'require("./package.json").name')
          latest=$(npm view "$name" version 2>/dev/null || true)
          floor=$(printf '%s\n%s\n' "$main" "$latest" | sort -V | tail -1)
          versions=$(npm view "$name" versions --json 2>/dev/null || true)
          next=$(node scripts/next-version.mjs "$pr" "$floor" "$versions")
          [ "$next" != "$pr" ] || exit 0
          echo "::warning file=package.json::version $pr is not above both main ($main) and npm's latest ($latest)" \
            "— bin/release will publish it as $next"
